<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft English Quiz for Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://i.postimg.cc/c4PVz0FK/i-tried-recreating-that-one-minecraft-wallpaper-that-was-v0-5uuduk40yno71.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        /* --- หน้า Video Intro --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #intro-video {
            width: 100%;
            height: 100%;
            border: none;
        }
        .skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.8);
            color: #55FF55;
            border: 2px solid #55FF55;
            padding: 10px 24px;
            font-family: 'Kanit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .skip-btn:hover {
            background: #55FF55;
            color: #000;
        }

        /* --- หน้าเกมหลัก --- */
        .quiz-container {
            background-color: rgba(43, 43, 43, 0.92);
            border: 6px solid #000;
            outline: 6px solid #737373;
            box-shadow: 0 12px 24px rgba(0,0,0,0.7);
            padding: 25px 20px;
            width: 100%;
            max-width: 680px;
            text-align: center;
            color: #fff;
            border-radius: 8px;
            backdrop-filter: blur(3px);
        }
        h1 {
            font-family: 'Press Start 2P', cursive;
            color: #55FF55;
            font-size: 1.6rem;
            text-shadow: 4px 4px #000;
            margin: 10px 0 20px 0;
            line-height: 1.4;
        }

        /* --- หน้ากรอกชื่อนักเรียน --- */
        .name-box {
            background: #1e1e1e;
            border: 4px solid #555;
            padding: 25px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .name-box label {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFFF55;
            display: block;
            margin-bottom: 15px;
        }
        .name-input {
            width: 100%;
            padding: 15px;
            font-size: 1.4rem;
            font-family: 'Kanit', sans-serif;
            font-weight: 700;
            border: 4px solid #555;
            border-radius: 6px;
            background: #111;
            color: #55FF55;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            user-select: text;
        }
        .name-input:focus {
            border-color: #55FF55;
        }
        .start-btn {
            background: #ffb300;
            color: #000;
            border: 5px solid;
            border-color: #ffe082 #ff6f00 #ff6f00 #ffe082;
            font-size: 1.6rem;
            font-weight: 800;
            width: 100%;
            padding: 15px;
            cursor: pointer;
            border-radius: 6px;
            font-family: 'Kanit', sans-serif;
            transition: transform 0.1s;
        }
        .start-btn:active {
            transform: scale(0.98);
        }

        .score-board {
            font-size: 1.3rem;
            font-weight: 700;
            background: #111;
            padding: 12px;
            border: 3px solid #555;
            color: #FFFF55;
            margin-bottom: 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .player-display {
            color: #55FFFF;
        }
        .question-box {
            background: #1e1e1e;
            border: 4px solid #555;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            position: relative;
        }
        .question-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFF;
            line-height: 1.4;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }
        .translation-box {
            background: #003366;
            border: 3px solid #55FFFF;
            color: #55FFFF;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            line-height: 1.5;
        }
        .translation-box div {
            margin-bottom: 4px;
        }
        .action-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .speak-btn, .translate-btn {
            color: #000;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.1s;
            font-family: 'Kanit', sans-serif;
        }
        .speak-btn {
            background: #55FFFF;
            border: 3px solid #00AAAA;
            box-shadow: 0 4px 0 #00AAAA;
        }
        .translate-btn {
            background: #FF55FF;
            border: 3px solid #AA00AA;
            box-shadow: 0 4px 0 #AA00AA;
            color: #FFF;
            text-shadow: 1px 1px #000;
        }
        .speak-btn:active, .translate-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #000;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .btn {
            background: #727272;
            border: 5px solid;
            border-color: #FFF #373737 #373737 #FFF;
            color: #FFF;
            padding: 18px 15px;
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            text-shadow: 2px 2px #000;
            border-radius: 6px;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn.correct {
            background: #2e7d32 !important;
            color: #FFF !important;
            border-color: #81c784 #1b5e20 #1b5e20 #81c784 !important;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(85, 255, 85, 0.6);
            animation: pulse-green 0.6s ease-in-out;
        }

        .btn.wrong {
            background: #c62828 !important;
            color: #FFF !important;
            border-color: #ef9a9a #b71c1c #b71c1c #ef9a9a !important;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .btn.dimmed {
            opacity: 0.45;
            transform: scale(0.98);
        }

        @keyframes pulse-green {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); box-shadow: 0 0 25px rgba(85, 255, 85, 0.9); }
            100% { transform: scale(1.02); box-shadow: 0 0 15px rgba(85, 255, 85, 0.6); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .next-btn, .restart-btn {
            margin-top: 25px;
            background: #ffb300;
            color: #000;
            border-color: #ffe082 #ff6f00 #ff6f00 #ffe082;
            font-size: 1.8rem;
            font-weight: 800;
            width: 100%;
            text-align: center;
            text-shadow: none;
        }
        .hide {
            display: none !important;
        }
        .result-title {
            font-family: 'Press Start 2P', cursive;
            color: #FFFF55;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .result-score {
            font-size: 3.5rem;
            color: #55FF55;
            font-weight: 800;
            margin: 15px 0;
            text-shadow: 3px 3px #000;
        }
        .feedback {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .player-result-name {
            font-size: 2rem;
            color: #55FFFF;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <!-- หน้าจอ Video Intro -->
    <div id="intro-screen">
        <iframe 
            id="intro-video" 
            src="https://streamable.com/e/5kuk8m?autoplay=1&muted=0" 
            allow="autoplay; fullscreen; encrypted-media">
        </iframe>
        <button class="skip-btn" id="skip-btn">ข้ามไปหน้าเกม ➔</button>
    </div>

    <!-- Container เกมหลัก -->
    <div class="quiz-container">
        <h1>MINECRAFT<br>ENGLISH QUIZ</h1>
        
        <!-- หน้ากรอกชื่อนักเรียน -->
        <div id="name-screen">
            <div class="name-box">
                <label for="student-name">👤 พิมพ์ชื่อนักเรียนก่อนเริ่มเล่น:</label>
                <input type="text" id="student-name" class="name-input" placeholder="กรอกชื่อ-นามสกุล หรือชื่อเล่น..." autocomplete="off">
                <button class="start-btn" id="start-game-btn">เริ่มทำแบบทดสอบ 🎮</button>
            </div>
        </div>

        <!-- หน้าคำถาม -->
        <div id="quiz-box" class="hide">
            <div class="score-board">
                <span class="player-display">👤 ผู้เล่น: <span id="player-name-text">-</span></span>
                <span>ข้อที่ <span id="current-quest">1</span>/10 | คะแนน: <span id="score">0</span></span>
            </div>

            <div class="question-box">
                <div class="question-text" id="question">Question text here</div>
                <div class="action-btns">
                    <button class="speak-btn" id="speak-btn">🔊 ฟังเสียงอ่าน</button>
                    <button class="translate-btn" id="translate-btn">🇹🇭 แปลคำถามและตัวเลือก</button>
                </div>
                <div class="translation-box hide" id="translation-box"></div>
            </div>

            <div class="btn-grid" id="answer-buttons">
                <button class="btn">Option 1</button>
                <button class="btn">Option 2</button>
                <button class="btn">Option 3</button>
                <button class="btn">Option 4</button>
            </div>

            <button id="next-btn" class="btn next-btn hide">ข้อถัดไป ➔</button>
        </div>

        <!-- หน้าสรุปคะแนน -->
        <div id="result-box" class="hide">
            <div class="result-title">GAME OVER!</div>
            <div class="player-result-name" id="final-player-name">นักเรียน</div>
            <p style="font-size: 1.6rem; margin: 10px 0 0 0;">ทำคะแนนได้ทั้งหมด</p>
            <div class="result-score" id="final-score">0 / 10</div>
            <div id="feedback-msg" class="feedback"></div>
            <button id="restart-btn" class="btn restart-btn">นักเรียนคนถัดไป 🔄</button>
        </div>
    </div>

    <script>
        const introScreen = document.getElementById("intro-screen");
        const introVideo = document.getElementById("intro-video");
        const skipBtn = document.getElementById("skip-btn");
        let autoCloseTimer;

        function closeIntro() {
            clearTimeout(autoCloseTimer);
            introScreen.classList.add("hide");
            introVideo.src = "";
        }

        autoCloseTimer = setTimeout(closeIntro, 18500);
        skipBtn.addEventListener("click", closeIntro);

        // ระบบ Audio Context สำหรับเสียงตอบถูก/ผิด
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playCorrectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(659.25, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.15);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(783.99, now + 0.12);
            gain2.gain.setValueAtTime(0.4, now + 0.12);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.12);
            osc2.stop(now + 0.35);
        }

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function speakQuestion() {
            window.speechSynthesis.cancel();
            const rawText = questions[currentQuestionIndex].question;
            const textToSpeak = rawText.replace(/^[0-9]+\.\s*/, ''); 
            
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        // เพิ่มการแปลตัวเลือกคำตอบสำหรับทุกข้อ
        const questions = [
            { 
                question: "1. What color is a Creeper?", 
                translation: "คีปเปอร์มีสีอะไร?", 
                answers: ["A) Blue", "B) Green", "C) Red", "D) Yellow"], 
                answersTranslation: ["A) สีน้ำเงิน", "B) สีเขียว", "C) สีแดง", "D) สีเหลือง"],
                correct: 1 
            },
            { 
                question: "2. Which animal is pink and gives you meat?", 
                translation: "สัตว์ตัวไหนมีสีชมพูและให้เนื้อ?", 
                answers: ["A) Pig", "B) Cow", "C) Sheep", "D) Chicken"], 
                answersTranslation: ["A) หมู", "B) วัว", "C) แกะ", "D) ไก่"],
                correct: 0 
            },
            { 
                question: "3. What tool do you use to mine ores and stone?", 
                translation: "อุปกรณ์อะไรที่คุณใช้ขุดแร่และหิน?", 
                answers: ["A) Sword", "B) Axe", "C) Pickaxe", "D) Shovel"], 
                answersTranslation: ["A) ดาบ", "B) ขวาน", "C) อีเตอร์/ที่ขุดหิน", "D) พลั่ว"],
                correct: 2 
            },
            { 
                question: "4. Where do you sleep to skip the night?", 
                translation: "คุณนอนที่ไหนเพื่อข้ามเวลากลางคืน?", 
                answers: ["A) Chair", "B) Bed", "C) Table", "D) Door"], 
                answersTranslation: ["A) เก้าอี้", "B) เตียงนอน", "C) โต๊ะ", "D) ประตู"],
                correct: 1 
            },
            { 
                question: "5. Which animal gives you milk?", 
                translation: "สัตว์ชนิดใดให้นมแก่คุณ?", 
                answers: ["A) Pig", "B) Sheep", "C) Cow", "D) Chicken"], 
                answersTranslation: ["A) หมู", "B) แกะ", "C) วัว", "D) ไก่"],
                correct: 2 
            },
            { 
                question: "6. What weapon do you use to shoot arrows?", 
                translation: "อาวุธชนิดใดที่คุณใช้ยิงลูกธนู?", 
                answers: ["A) Sword", "B) Bow", "C) Shield", "D) Axe"], 
                answersTranslation: ["A) ดาบ", "B) คันธนู", "C) โล่", "D) ขวาน"],
                correct: 1 
            },
            { 
                question: "7. Which food can you make with wheat?", 
                translation: "อาหารชนิดใดที่คุณทำได้จากข้าวสาลี?", 
                answers: ["A) Apple", "B) Bread", "C) Fish", "D) Carrot"], 
                answersTranslation: ["A) แอปเปิล", "B) ขนมปัง", "C) ปลา", "D) แครอท"],
                correct: 1 
            },
            { 
                question: "8. What happens to a Zombie when the sun comes up?", 
                translation: "เกิดอะไรขึ้นกับซอมบี้เมื่อพระอาทิตย์ขึ้น?", 
                answers: ["A) It sleeps", "B) It dances", "C) It burns", "D) It swims"], 
                answersTranslation: ["A) มันนอนหลับ", "B) มันเต้นรำ", "C) มันเผาไหม้", "D) มันว่ายน้ำ"],
                correct: 2 
            },
            { 
                question: "9. What color is a Diamond?", 
                translation: "เพชรมีสีอะไร?", 
                answers: ["A) Red", "B) Blue", "C) Green", "D) Pink"], 
                answersTranslation: ["A) สีแดง", "B) สีฟ้า/น้ำเงิน", "C) สีเขียว", "D) สีชมพู"],
                correct: 1 
            },
            { 
                question: "10. How many eyes does a Spider have in Minecraft?", 
                translation: "แมงมุมในเกม Minecraft มีกี่ตา?", 
                answers: ["A) 2", "B) 4", "C) 6", "D) 8"], 
                answersTranslation: ["A) 2 ตา", "B) 4 ตา", "C) 6 ตา", "D) 8 ตา"],
                correct: 3 
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let studentName = "";

        const nameScreen = document.getElementById("name-screen");
        const studentNameInput = document.getElementById("student-name");
        const startGameBtn = document.getElementById("start-game-btn");
        const playerNameText = document.getElementById("player-name-text");
        const finalPlayerName = document.getElementById("final-player-name");

        const questionElement = document.getElementById("question");
        const answerButtonsElement = document.getElementById("answer-buttons");
        const nextButton = document.getElementById("next-btn");
        const speakButton = document.getElementById("speak-btn");
        const translateButton = document.getElementById("translate-btn");
        const translationBox = document.getElementById("translation-box");
        const currentQuestElement = document.getElementById("current-quest");
        const scoreElement = document.getElementById("score");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const finalScoreElement = document.getElementById("final-score");
        const feedbackMsg = document.getElementById("feedback-msg");
        const restartButton = document.getElementById("restart-btn");

        startGameBtn.addEventListener("click", () => {
            const enteredName = studentNameInput.value.trim();
            if (enteredName === "") {
                alert("กรุณากรอกชื่อนักเรียนก่อนเริ่มเล่นครับ!");
                return;
            }
            studentName = enteredName;
            playerNameText.innerText = studentName;
            nameScreen.classList.add("hide");
            startGame();
        });

        function startGame() {
            currentQuestionIndex = 0;
            score = 0;
            scoreElement.innerText = score;
            quizBox.classList.remove("hide");
            resultBox.classList.add("hide");
            showQuestion();
        }

        function showQuestion() {
            resetState();
            let currentQuestion = questions[currentQuestionIndex];
            currentQuestElement.innerText = currentQuestionIndex + 1;
            questionElement.innerText = currentQuestion.question;

            // จัดฟอร์แมตการแปลทั้งคำถามและตัวเลือก
            let translationHTML = `<div><strong>❓ คำถาม:</strong> ${currentQuestion.translation}</div>`;
            translationHTML += `<div style="margin-top:6px;"><strong>ตัวเลือก:</strong></div>`;
            currentQuestion.answersTranslation.forEach(ansTrans => {
                translationHTML += `<div style="padding-left:10px;">• ${ansTrans}</div>`;
            });
            translationBox.innerHTML = translationHTML;

            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement("button");
                button.innerText = answer;
                button.classList.add("btn");
                if (index === currentQuestion.correct) {
                    button.dataset.correct = true;
                }
                button.addEventListener("click", selectAnswer);
                answerButtonsElement.appendChild(button);
            });
        }

        function resetState() {
            window.speechSynthesis.cancel();
            translationBox.classList.add("hide");
            nextButton.classList.add("hide");
            while (answerButtonsElement.firstChild) {
                answerButtonsElement.removeChild(answerButtonsElement.firstChild);
            }
        }

        function toggleTranslation() {
            translationBox.classList.toggle("hide");
        }

        function selectAnswer(e) {
            window.speechSynthesis.cancel();
            const selectedButton = e.target;
            const isCorrect = selectedButton.dataset.correct === "true";

            if (isCorrect) {
                selectedButton.classList.add("correct");
                playCorrectSound();
                score++;
                scoreElement.innerText = score;
            } else {
                selectedButton.classList.add("wrong");
                playWrongSound();
            }

            Array.from(answerButtonsElement.children).forEach(button => {
                if (button.dataset.correct === "true") {
                    button.classList.add("correct");
                } else if (button !== selectedButton) {
                    button.classList.add("dimmed");
                }
                button.disabled = true;
            });

            if (questions.length > currentQuestionIndex + 1) {
                setTimeout(() => {
                    nextButton.classList.remove("hide");
                }, 400);
            } else {
                setTimeout(showResult, 1500);
            }
        }

        function showResult() {
            quizBox.classList.add("hide");
            resultBox.classList.remove("hide");
            finalPlayerName.innerText = `👤 ${studentName}`;
            finalScoreElement.innerText = `${score} / ${questions.length}`;
            
            if (score === 10) {
                feedbackMsg.innerText = "เก่งมาก! ตอบถูกหมดทุกข้อเลย 🏆";
            } else if (score >= 7) {
                feedbackMsg.innerText = "ยอดเยี่ยมมาก! คุณรู้จัก Minecraft ดีมาก 👍";
            } else if (score >= 5) {
                feedbackMsg.innerText = "ผ่านแล้ว! ลองเล่นอีกรอบให้ได้เต็มดูนะ 😃";
            } else {
                feedbackMsg.innerText = "พยายามอีกนิด! ลองใหม่อีกครั้งนะ 🎮";
            }
        }

        speakButton.addEventListener("click", speakQuestion);
        translateButton.addEventListener("click", toggleTranslation);
        nextButton.addEventListener("click", () => {
            currentQuestionIndex++;
            showQuestion();
        });

        restartButton.addEventListener("click", () => {
            studentNameInput.value = "";
            resultBox.classList.add("hide");
            nameScreen.classList.remove("hide");
        });
    </script>
</body>
</html>
