<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft English Quiz for Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://i.postimg.cc/c4PVz0FK/i-tried-recreating-that-one-minecraft-wallpaper-that-was-v0-5uuduk40yno71.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        /* --- 1. Welcome Screen (หน้าแรกสุด) --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .welcome-card {
            background: #2b2b2b;
            border: 6px solid #000;
            outline: 6px solid #737373;
            padding: 40px 30px;
            text-align: center;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .welcome-card h2 {
            font-family: 'Press Start 2P', cursive;
            color: #55FF55;
            font-size: 1.8rem;
            text-shadow: 4px 4px #000;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .launch-btn {
            background: #ffb300;
            color: #000;
            border: 5px solid;
            border-color: #ffe082 #ff6f00 #ff6f00 #ffe082;
            font-size: 1.8rem;
            font-weight: 800;
            width: 100%;
            padding: 18px;
            cursor: pointer;
            border-radius: 8px;
            font-family: 'Kanit', sans-serif;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 6px 0 #b34e00;
        }
        .launch-btn:hover { filter: brightness(1.1); }
        .launch-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b34e00; }

        /* --- 2. Video Screen (อยู่ระหว่างหน้าแรกกับหน้าลงชื่อ) --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.8);
            color: #55FF55;
            border: 2px solid #55FF55;
            padding: 10px 24px;
            font-family: 'Kanit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: auto;
            z-index: 10001;
        }
        .skip-btn:hover { background: #55FF55; color: #000; }

        /* --- 3. Main Quiz Container --- */
        .quiz-container {
            background-color: rgba(43, 43, 43, 0.92);
            border: 6px solid #000;
            outline: 6px solid #737373;
            box-shadow: 0 12px 24px rgba(0,0,0,0.7);
            padding: 25px 20px;
            width: 100%;
            max-width: 680px;
            text-align: center;
            color: #fff;
            border-radius: 8px;
            backdrop-filter: blur(3px);
        }
        h1 {
            font-family: 'Press Start 2P', cursive;
            color: #55FF55;
            font-size: 1.6rem;
            text-shadow: 4px 4px #000;
            margin: 10px 0 20px 0;
            line-height: 1.4;
        }

        .level-badge {
            display: inline-block;
            background: #ff55ff;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 1px 1px #000;
            border: 2px solid #fff;
        }

        .name-box {
            background: #1e1e1e;
            border: 4px solid #555;
            padding: 25px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .name-box label {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFFF55;
            display: block;
            margin-bottom: 15px;
        }
        .name-input {
            width: 100%;
            padding: 15px;
            font-size: 1.4rem;
            font-family: 'Kanit', sans-serif;
            font-weight: 700;
            border: 4px solid #555;
            border-radius: 6px;
            background: #111;
            color: #55FF55;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            user-select: text;
        }
        .name-input:focus { border-color: #55FF55; }
        .start-btn {
            background: #ffb300;
            color: #000;
            border: 5px solid;
            border-color: #ffe082 #ff6f00 #ff6f00 #ffe082;
            font-size: 1.6rem;
            font-weight: 800;
            width: 100%;
            padding: 15px;
            cursor: pointer;
            border-radius: 6px;
            font-family: 'Kanit', sans-serif;
            transition: transform 0.1s;
        }
        .start-btn:active { transform: scale(0.98); }

        .score-board {
            font-size: 1.3rem;
            font-weight: 700;
            background: #111;
            padding: 12px;
            border: 3px solid #555;
            color: #FFFF55;
            margin-bottom: 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .player-display { color: #55FFFF; }
        .question-box {
            background: #1e1e1e;
            border: 4px solid #555;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            position: relative;
        }
        .question-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFF;
            line-height: 1.4;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }
        .translation-box {
            background: #003366;
            border: 3px solid #55FFFF;
            color: #55FFFF;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            line-height: 1.5;
        }
        .translation-box div { margin-bottom: 4px; }
        .action-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .speak-btn, .translate-btn {
            color: #000;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.1s;
            font-family: 'Kanit', sans-serif;
        }
        .speak-btn { background: #55FFFF; border: 3px solid #00AAAA; box-shadow: 0 4px 0 #00AAAA; }
        .translate-btn { background: #FF55FF; border: 3px solid #AA00AA; box-shadow: 0 4px 0 #AA00AA; color: #FFF; text-shadow: 1px 1px #000; }
        .speak-btn:active, .translate-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .btn {
            background: #727272;
            border: 5px solid;
            border-color: #FFF #373737 #373737 #FFF;
            color: #FFF;
            padding: 18px 15px;
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            text-shadow: 2px 2px #000;
            border-radius: 6px;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active:not(:disabled) { transform: translateY(1px); }

        .btn.correct {
            background: #2e7d32 !important;
            color: #FFF !important;
            border-color: #81c784 #1b5e20 #1b5e20 #81c784 !important;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(85, 255, 85, 0.6);
            animation: pulse-green 0.6s ease-in-out;
        }

        .btn.wrong {
            background: #c62828 !important;
            color: #FFF !important;
            border-color: #ef9a9a #b71c1c #b71c1c #ef9a9a !important;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .btn.dimmed { opacity: 0.45; transform: scale(0.98); }

        @keyframes pulse-green {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); box-shadow: 0 0 25px rgba(85, 255, 85, 0.9); }
            100% { transform: scale(1.02); box-shadow: 0 0 15px rgba(85, 255, 85, 0.6); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .next-btn, .restart-btn, .retry-l2-btn, .level2-btn {
            margin-top: 15px;
            background: #ffb300;
            color: #000;
            border-color: #ffe082 #ff6f00 #ff6f00 #ffe082;
            font-size: 1.8rem;
            font-weight: 800;
            width: 100%;
            text-align: center;
            text-shadow: none;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
        }
        .level2-btn {
            background: #00e676;
            border-color: #b9f6ca #00a152 #00a152 #b9f6ca;
        }
        .retry-l2-btn {
            background: #ff9100;
            border-color: #ffe0b2 #e65100 #e65100 #ffe0b2;
        }
        .hide { display: none !important; }
        .result-title {
            font-family: 'Press Start 2P', cursive;
            color: #FFFF55;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .result-score {
            font-size: 3.5rem;
            color: #55FF55;
            font-weight: 800;
            margin: 15px 0;
            text-shadow: 3px 3px #000;
        }
        .feedback {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .player-result-name {
            font-size: 2rem;
            color: #55FFFF;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <!-- 1. Welcome Screen (หน้าแรก) -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <h2>MINECRAFT<br>QUIZ GAME</h2>
            <button class="launch-btn" id="launch-btn">เริ่มเล่นเกม 🎮</button>
        </div>
    </div>

    <!-- 2. Video Screen (เล่นวิดีโอคั่นระหว่างหน้าแรกและหน้าลงชื่อ) -->
    <div id="intro-screen" class="hide">
        <div id="video-container"></div>
        <button class="skip-btn" id="skip-btn">ข้าม ➔</button>
    </div>

    <!-- 3. Main Quiz Container -->
    <div class="quiz-container">
        <h1>MINECRAFT<br>ENGLISH QUIZ</h1>
        
        <!-- Name Screen (หน้าลงชื่อ) -->
        <div id="name-screen">
            <div class="name-box">
                <label for="student-name">👤 พิมพ์ชื่อนักเรียนก่อนเริ่มเล่น:</label>
                <input type="text" id="student-name" class="name-input" placeholder="กรอกชื่อ-นามสกุล หรือชื่อเล่น..." autocomplete="off">
                <button class="start-btn" id="start-game-btn">เริ่มทำแบบทดสอบ 🎮</button>
            </div>
        </div>

        <!-- Question Box -->
        <div id="quiz-box" class="hide">
            <div id="level-badge" class="level-badge">LEVEL 1</div>
            <div class="score-board">
                <span class="player-display">👤 ผู้เล่น: <span id="player-name-text">-</span></span>
                <span>ข้อที่ <span id="current-quest">1</span>/10 | คะแนน: <span id="score">0</span></span>
            </div>

            <div class="question-box">
                <div class="question-text" id="question">Question text here</div>
                <div class="action-btns">
                    <button class="speak-btn" id="speak-btn">🔊 ฟังเสียงอ่าน</button>
                    <button class="translate-btn" id="translate-btn">🇹🇭 แปลคำถามและตัวเลือก</button>
                </div>
                <div class="translation-box hide" id="translation-box"></div>
            </div>

            <div class="btn-grid" id="answer-buttons"></div>

            <button id="next-btn" class="btn next-btn hide">ข้อถัดไป ➔</button>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="hide">
            <div class="result-title" id="result-title-text">GAME OVER!</div>
            <div class="player-result-name" id="final-player-name">นักเรียน</div>
            <p style="font-size: 1.6rem; margin: 10px 0 0 0;">ทำคะแนนได้ทั้งหมด</p>
            <div class="result-score" id="final-score">0 / 10</div>
            <div id="feedback-msg" class="feedback"></div>
            
            <!-- Action Buttons -->
            <button id="level2-btn" class="btn level2-btn hide">ด่านถัดไป (Level 2) ➔</button>
            <button id="retry-l2-btn" class="btn retry-l2-btn hide">ลองใหม่อีกครั้ง (Level 2) 🔄</button>
            <button id="restart-btn" class="btn restart-btn hide">นักเรียนคนถัดไป 🔄</button>
        </div>
    </div>

    <script>
        const welcomeScreen = document.getElementById("welcome-screen");
        const launchBtn = document.getElementById("launch-btn");
        const introScreen = document.getElementById("intro-screen");
        const videoContainer = document.getElementById("video-container");
        const skipBtn = document.getElementById("skip-btn");
        const nameScreen = document.getElementById("name-screen");
        let activeVideoCallback = null;

        // ลิงก์ Direct MP4
        const VIDEO_INTRO = "https://cdn-cf-east.streamable.com/video/mp4/5kuk8m.mp4";
        const VIDEO_LEVEL2 = "https://cdn-cf-east.streamable.com/video/mp4/ri8s22.mp4";

        function playVideoSrc(videoSrc, onEndCallback) {
            welcomeScreen.classList.add("hide");
            introScreen.classList.remove("hide");
            activeVideoCallback = onEndCallback;
            videoContainer.innerHTML = "";

            const videoElement = document.createElement("video");
            videoElement.src = videoSrc;
            videoElement.autoplay = true;
            videoElement.playsInline = true;
            videoElement.muted = false; // ปิด Mute เพื่อให้มีเสียงทันทีหลังผู้เล่นกดปุ่ม
            videoElement.controls = false;
            videoElement.style.width = "100%";
            videoElement.style.height = "100%";
            videoElement.style.objectFit = "contain";

            videoElement.addEventListener("ended", closeIntro);
            
            videoElement.addEventListener("error", () => {
                console.warn("วิดีโอมีปัญหา ข้ามไปส่วนถัดไปอัตโนมัติ");
                closeIntro();
            });

            videoContainer.appendChild(videoElement);

            const playPromise = videoElement.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.warn("Autoplay โดนบล็อก ลองเปิดเสียงหลังจากได้รับ Interaction:", error);
                    videoElement.muted = true;
                    videoElement.play().catch(() => closeIntro());
                });
            }
        }

        function closeIntro() {
            introScreen.classList.add("hide");
            videoContainer.innerHTML = "";
            if (activeVideoCallback) {
                const cb = activeVideoCallback;
                activeVideoCallback = null;
                cb();
            }
        }

        // เมื่อกด "เริ่มเล่นเกม 🎮" จากหน้าแรก -> เล่นวิดีโอ 5kuk8m มีเสียง -> เล่นจบเปิดหน้าลงชื่อทันที
        launchBtn.addEventListener("click", () => {
            playVideoSrc(VIDEO_INTRO, () => {
                nameScreen.classList.remove("hide");
            });
        });

        skipBtn.addEventListener("click", closeIntro);

        // Sound Effects (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playCorrectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(659.25, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.15);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(783.99, now + 0.12);
            gain2.gain.setValueAtTime(0.4, now + 0.12);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.12);
            osc2.stop(now + 0.35);
        }

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function speakQuestion() {
            window.speechSynthesis.cancel();
            const currentQuestions = currentLevel === 1 ? questionsL1 : questionsL2;
            const rawText = currentQuestions[currentQuestionIndex].question;
            const textToSpeak = rawText.replace(/^[0-9]+\.\s*/, ''); 
            
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        // --- LEVEL 1 QUESTIONS ---
        const questionsL1 = [
            { 
                question: "1. What color is a Creeper?", 
                translation: "คีปเปอร์มีสีอะไร?", 
                answers: ["A) Blue", "B) Green", "C) Red", "D) Yellow"], 
                answersTranslation: ["A) สีน้ำเงิน", "B) สีเขียว", "C) สีแดง", "D) สีเหลือง"],
                correct: 1 
            },
            { 
                question: "2. Which animal is pink and gives you meat?", 
                translation: "สัตว์ตัวไหนมีสีชมพูและให้เนื้อ?", 
                answers: ["A) Pig", "B) Cow", "C) Sheep", "D) Chicken"], 
                answersTranslation: ["A) หมู", "B) วัว", "C) แกะ", "D) ไก่"],
                correct: 0 
            },
            { 
                question: "3. What tool do you use to mine ores and stone?", 
                translation: "อุปกรณ์อะไรที่คุณใช้ขุดแร่และหิน?", 
                answers: ["A) Sword", "B) Axe", "C) Pickaxe", "D) Shovel"], 
                answersTranslation: ["A) ดาบ", "B) ขวาน", "C) อีเตอร์/ที่ขุดหิน", "D) พลั่ว"],
                correct: 2 
            },
            { 
                question: "4. Where do you sleep to skip the night?", 
                translation: "คุณนอนที่ไหนเพื่อข้ามเวลากลางคืน?", 
                answers: ["A) Chair", "B) Bed", "C) Table", "D) Door"], 
                answersTranslation: ["A) เก้าอี้", "B) เตียงนอน", "C) โต๊ะ", "D) ประตู"],
                correct: 1 
            },
            { 
                question: "5. Which animal gives you milk?", 
                translation: "สัตว์ชนิดใดให้นมแก่คุณ?", 
                answers: ["A) Pig", "B) Sheep", "C) Cow", "D) Chicken"], 
                answersTranslation: ["A) หมู", "B) แกะ", "C) วัว", "D) ไก่"],
                correct: 2 
            },
            { 
                question: "6. What weapon do you use to shoot arrows?", 
                translation: "อาวุธชนิดใดที่คุณใช้ยิงลูกธนู?", 
                answers: ["A) Sword", "B) Bow", "C) Shield", "D) Axe"], 
                answersTranslation: ["A) ดาบ", "B) คันธนู", "C) โล่", "D) ขวาน"],
                correct: 1 
            },
            { 
                question: "7. Which food can you make with wheat?", 
                translation: "อาหารชนิดใดที่คุณทำได้จากข้าวสาลี?", 
                answers: ["A) Apple", "B) Bread", "C) Fish", "D) Carrot"], 
                answersTranslation: ["A) แอปเปิล", "B) ขนมปัง", "C) ปลา", "D) แครอท"],
                correct: 1 
            },
            { 
                question: "8. What happens to a Zombie when the sun comes up?", 
                translation: "เกิดอะไรขึ้นกับซอมบี้เมื่อพระอาทิตย์ขึ้น?", 
                answers: ["A) It sleeps", "B) It dances", "C) It burns", "D) It swims"], 
                answersTranslation: ["A) มันนอนหลับ", "B) มันเต้นรำ", "C) มันเผาไหม้", "D) มันว่ายน้ำ"],
                correct: 2 
            },
            { 
                question: "9. What color is a Diamond?", 
                translation: "เพชรมีสีอะไร?", 
                answers: ["A) Red", "B) Blue", "C) Green", "D) Pink"], 
                answersTranslation: ["A) สีแดง", "B) สีฟ้า/น้ำเงิน", "C) สีเขียว", "D) สีชมพู"],

            { 
                question: "10. How many eyes does a Spider have in Minecraft?",

                answersTranslation: ["A) 2 ตา", "B) 4 ตา", "C) 6 ตา", "D) 8 ตา"],
                correct: 3 
            }
        ];

        // --- LEVEL 2 QUESTIONS ---
        const questionsL2 = [
            {
                question: "1. What item do you use to craft a Torch?",
                translation: "คุณใช้อะไรในการคราฟต์คบเพลิง (Torch)?",

                correct: 0
            },
            {
                question: "2. Which mob drops Enderman Pearls when defeated?",
                translation: "มอนสเตอร์ตัวใดดร็อปเอ็นเดอร์พาร์ล (Enderman Pearls) เมื่อถูกกำจัด?",
                answers: ["A) Skeleton", "B) Creeper", "C) Enderman", "D) Witch"],
                answersTranslation: ["A) สเกเลตัน", "B) คีปเปอร์", "C) เอ็นเดอร์แมน", "D) แม่มด"],

            },
            {
                question: "3. What dimension do you reach by building an Obsidian portal?",
                translation: "มิติใดที่คุณจะไปถึงเมื่อสร้างประตูจากหินออบซิเดียน?",
                answers: ["A) The End", "B) The Nether", "C) The Overworld", "D) The Sky"],
                answersTranslation: ["A) ดิเอ็นด์", "B) เดอะเนเธอร์", "C) ดิโอเวอร์เวิลด์", "D) ท้องฟ้า"],
                correct: 1
            },
            {
                question: "4. What block is used to smelt ores and cook food?",
                translation: "บล็อกใดที่ใช้ในการเผาแร่และปรุงอาหาร?",
                answers: ["A) Chest", "B) Crafting Table", "C) Furnace", "D) Anvil"],
                answersTranslation: ["A) หีบสมบัติ", "B) โต๊ะคราฟต์", "C) เตาเผา", "D) ทั่งตีเหล็ก"],
                correct: 2
            },
            {
                question: "5. Which creature explodes when it gets close to you?",
                translation: "สิ่งมีชีวิตใดจะระเบิดเมื่อมันเข้าใกล้คุณ?",
                answers: ["A) Zombie", "B) Creeper", "C) Spider", "D) Phantom"],
                answersTranslation: ["A) ซอมบี้", "B) คีปเปอร์", "C) แมงมุม", "D) แฟนทอม"],
                correct: 1
            },
            {
                question: "6. What item do you need to tame a Wolf?",
                translation: "ไอเทมใดที่คุณต้องใช้เพื่อเชื่องหมาป่า?",
                answers: ["A) Fish", "B) Bone", "C) Carrot", "D) Wheat"],
                answersTranslation: ["A) ปลา", "B) กระดูก", "C) แครอท", "D) ข้าวสาลี"],
                correct: 1
            },
            {
                question: "7. Which Ore is required to make Iron Tools?",
                translation: "แร่ชนิดใดที่จำเป็นสำหรับการทำอุปกรณ์เหล็ก?",
                answers: ["A) Gold Ore", "B) Iron Ore", "C) Coal Ore", "D) Emerald Ore"],
                answersTranslation: ["A) แร่ทอง", "B) แร่เหล็ก", "C) แร่ถ่าน", "D) แร่มรกต"],
                correct: 1
            },
            {
                question: "8. What mob flies in the sky if you do not sleep for days?",
                translation: "มอนสเตอร์ตัวใดจะบินบนฟ้าถ้าคุณไม่นอนหลายวัน?",
                answers: ["A) Bat", "B) Ghast", "C) Phantom", "D) Blaze"],
                answersTranslation: ["A) ค้างคาว", "B) แกสต์", "C) แฟนทอม", "D) เบลซ"],
                correct: 2
            },
            {
                question: "9. What material is needed to craft a Diamond Sword?",
                translation: "ต้องใช้วัสดุใดบ้างในการคราฟต์ดาบเพชร?",
                answers: ["A) 2 Diamonds + 1 Stick", "B) 3 Diamonds + 2 Sticks", "C) 1 Diamond + 2 Sticks", "D) 2 Diamonds + 2 Sticks"],
                answersTranslation: ["A) เพชร 2 เม็ด + ไม้แท่ง 1 อัน", "B) เพชร 3 เม็ด + ไม้แท่ง 2 อัน", "C) เพชร 1 เม็ด + ไม้แท่ง 2 อัน", "D) เพชร 2 เม็ด + ไม้แท่ง 2 อัน"],
                correct: 0
            },
            {
                question: "10. Who is the ultimate boss dragon found in The End?",
                translation: "มังกรที่เป็นบอสใหญ่ในมิติ The End มีชื่อว่าอะไร?",
                answers: ["A) Nether Dragon", "B) Ender Dragon", "C) Red Dragon", "D) Zombie Dragon"],
                answersTranslation: ["A) เนเธอร์ดรากอน", "B) เอนเดอร์ดรากอน", "C) เรดดรากอน", "D) ซอมบี้ดรากอน"],
                correct: 1
            }
        ];

        let currentLevel = 1;
        let currentQuestionIndex = 0;
        let score = 0;
        let studentName = "";

        const studentNameInput = document.getElementById("student-name");
        const startGameBtn = document.getElementById("start-game-btn");
        const playerNameText = document.getElementById("player-name-text");
        const finalPlayerName = document.getElementById("final-player-name");
        const levelBadge = document.getElementById("level-badge");

        const questionElement = document.getElementById("question");
        const answerButtonsElement = document.getElementById("answer-buttons");
        const nextButton = document.getElementById("next-btn");
        const speakButton = document.getElementById("speak-btn");
        const translateButton = document.getElementById("translate-btn");
        const translationBox = document.getElementById("translation-box");
        const currentQuestElement = document.getElementById("current-quest");
        const scoreElement = document.getElementById("score");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const finalScoreElement = document.getElementById("final-score");
        const feedbackMsg = document.getElementById("feedback-msg");
        const restartButton = document.getElementById("restart-btn");
        const retryL2Button = document.getElementById("retry-l2-btn");
        const level2Button = document.getElementById("level2-btn");

        startGameBtn.addEventListener("click", () => {
            const enteredName = studentNameInput.value.trim();
            if (enteredName === "") {
                alert("กรุณากรอกชื่อนักเรียนก่อนเริ่มเล่นครับ!");
                return;
            }
            studentName = enteredName;
            playerNameText.innerText = studentName;
            nameScreen.classList.add("hide");
            currentLevel = 1;
            startGame();
        });

        function startGame() {
            currentQuestionIndex = 0;
            score = 0;
            scoreElement.innerText = score;
            levelBadge.innerText = `LEVEL ${currentLevel}`;
            quizBox.classList.remove("hide");
            resultBox.classList.add("hide");
            showQuestion();
        }

        function showQuestion() {
            resetState();
            const activeQuestions = currentLevel === 1 ? questionsL1 : questionsL2;
            let currentQuestion = activeQuestions[currentQuestionIndex];
            
            currentQuestElement.innerText = currentQuestionIndex + 1;
            questionElement.innerText = currentQuestion.question;

            let translationHTML = `<div><strong>❓ คำถาม:</strong> ${currentQuestion.translation}</div>`;
            translationHTML += `<div style="margin-top:6px;"><strong>ตัวเลือก:</strong></div>`;
            currentQuestion.answersTranslation.forEach(ansTrans => {
                translationHTML += `<div style="padding-left:10px;">• ${ansTrans}</div>`;
            });
            translationBox.innerHTML = translationHTML;

            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement("button");
                button.innerText = answer;
                button.classList.add("btn");
                if (index === currentQuestion.correct) {
                    button.dataset.correct = true;
                }
                button.addEventListener("click", selectAnswer);
                answerButtonsElement.appendChild(button);
            });
        }

        function resetState() {
            window.speechSynthesis.cancel();
            translationBox.classList.add("hide");
            nextButton.classList.add("hide");
            while (answerButtonsElement.firstChild) {
                answerButtonsElement.removeChild(answerButtonsElement.firstChild);
            }
        }

        function toggleTranslation() {
            translationBox.classList.toggle("hide");
        }

        function selectAnswer(e) {
            window.speechSynthesis.cancel();
            const selectedButton = e.target;
            const isCorrect = selectedButton.dataset.correct === "true";

            if (isCorrect) {
                selectedButton.classList.add("correct");
                playCorrectSound();
                score++;
                scoreElement.innerText = score;
            } else {
                selectedButton.classList.add("wrong");
                playWrongSound();
            }

            Array.from(answerButtonsElement.children).forEach(button => {
                if (button.dataset.correct === "true") {
                    button.classList.add("correct");
                } else if (button !== selectedButton) {
                    button.classList.add("dimmed");
                }
                button.disabled = true;
            });

            const activeQuestions = currentLevel === 1 ? questionsL1 : questionsL2;

            if (activeQuestions.length > currentQuestionIndex + 1) {
                setTimeout(() => {
                    nextButton.classList.remove("hide");
                }, 400);
            } else {
                setTimeout(showResult, 1500);
            }
        }

        function showResult() {
            quizBox.classList.add("hide");
            resultBox.classList.remove("hide");
            finalPlayerName.innerText = `👤 ${studentName}`;
            finalScoreElement.innerText = `${score} / 10`;

            restartButton.classList.add("hide");
            level2Button.classList.add("hide");
            retryL2Button.classList.add("hide");

            if (score === 10) {
                if (currentLevel === 1) {
                    feedbackMsg.innerText = "สุดยอดมาก! ผ่าน Level 1 ด้วยคะแนนเต็ม 🏆";
                    level2Button.classList.remove("hide");
                } else {
                    feedbackMsg.innerText = "ยอดเยี่ยมที่สุด! คุณผ่านครบทั้ง 2 ด่านแล้ว 👑";
                    restartButton.innerText = "นักเรียนคนถัดไป 🔄";
                    restartButton.classList.remove("hide");
                }
            } else {
                if (currentLevel === 1) {
                    feedbackMsg.innerText = `ทำได้ ${score}/10 คะแนน ลองใหม่อีกครั้งนะ! 👍`;
                    restartButton.innerText = "นักเรียนคนถัดไป 🔄";
                    restartButton.classList.remove("hide");
                } else {
                    feedbackMsg.innerText = `ทำได้ ${score}/10 คะแนน ใน Level 2 ลองอีกทีนะ! 💪`;
                    retryL2Button.classList.remove("hide");
                    restartButton.innerText = "เปลี่ยนนักเรียน 👤";
                    restartButton.classList.remove("hide");
                }
            }
        }

        speakButton.addEventListener("click", speakQuestion);
        translateButton.addEventListener("click", toggleTranslation);
        
        nextButton.addEventListener("click", () => {
            currentQuestionIndex++;
            showQuestion();
        });

        restartButton.addEventListener("click", () => {
            studentNameInput.value = "";
            resultBox.classList.add("hide");
            nameScreen.classList.remove("hide");
        });

        retryL2Button.addEventListener("click", () => {
            currentLevel = 2;
            startGame();
        });

        level2Button.addEventListener("click", () => {
            resultBox.classList.add("hide");
            playVideoSrc(VIDEO_LEVEL2, () => {
                currentLevel = 2;
                startGame();
            });
        });
    </script>
</body>
</html>
